services:
  workbuddy-control-center:
    build: .
    container_name: workbuddy-control-center
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      WBCC_LISTEN: "0.0.0.0:8787"
      WBCC_AUTH_DIR: "/auths"
      WBCC_DATA_DIR: "/data"
      WBCC_USERNAME: "admin"
      WBCC_TASK_RUNNER: "/gateway-scripts/task_runner.py"
    volumes:
      - ./control-center.json:/app/control-center.json:ro
      # 唯一与网关共享的内容：WorkBuddy OAuth 凭据。
      - ../workbuddy2api/auths:/auths
      # 复用上游已吸收并验证过的成长任务 runner；只读挂载，不改网关代码。
      - ../workbuddy2api/scripts:/gateway-scripts:ro
      - ./data:/data
    restart: unless-stopped
